<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidTaxi Győr – Helyi taxi pénteken és szombaton</title>
  <meta name="description" content="Helyi taxiszolgáltatás Győrben. Főként pénteki és szombati éjszakákon, egyedi fuvarok egyeztetés alapján." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
</head>

<body>

  <!-- FLOATING CALL BUTTON (mobile) -->
  <a href="tel:+36301234567"
     class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50
            bg-brand-yellow text-brand-navy font-heading font-black text-lg
            px-10 py-4 rounded-full shadow-2xl flex items-center gap-3
            active:scale-95 transition-transform duration-150"
     aria-label="Hívj most">
    <span class="text-2xl">📞</span>
    <span>Hívj most!</span>
  </a>

  <!-- HERO -->
  <section class="relative min-h-screen flex items-center justify-center overflow-hidden bg-brand-navy">

    <img
      src="assets/header.jpg"
      alt=""
      class="absolute inset-0 w-full h-full object-cover opacity-40 scale-105"
      aria-hidden="true"
    />
    <div class="absolute inset-0 bg-gradient-to-b from-brand-navy/70 via-brand-navy/50 to-brand-navy/80"></div>

    <div class="relative z-10 text-center px-6 max-w-3xl mx-auto">
      <div class="mb-8">
        <div class="font-heading font-black text-6xl md:text-8xl italic tracking-tight drop-shadow-2xl leading-none mb-4">
          <span class="text-white">Rapid</span><span class="text-brand-yellow">Taxi</span><span class="text-white"> Győr</span>
        </div>
        <img
          src="assets/g2.png"
          alt="RapidTaxi Győr"
          class="mx-auto w-72 md:w-96 drop-shadow-2xl"
          style="filter: brightness(0) invert(1);"
        />
      </div>

      <h1 class="text-4xl md:text-6xl font-heading font-black text-white leading-tight mb-5">
        Gyors. Megbízható.<br/>
        <span class="text-brand-yellow">Mindig időben.</span>
      </h1>
      <p class="text-gray-300 text-lg md:text-xl mb-10 font-light">
        Helyi taxi Győrben.
      </p>

      <a href="tel:+36301234567" class="btn-primary text-xl py-5 px-14">
        📞 +36 30 123 4567
      </a>
    </div>

  </section>

  <!-- FOOTER -->
  <footer class="bg-black py-8 pb-28 md:pb-8">
    <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-gray-600">
      <span>© 2026 RapidTaxi Győr · Győr, Magyarország</span>
      <div class="flex gap-4">
        <a href="privacy.html" class="hover:text-gray-400 transition-colors">Adatvédelmi tájékoztató</a>
        <button onclick="localStorage.removeItem('rapidtaxi_consent');location.reload();" class="hover:text-gray-400 transition-colors cursor-pointer bg-transparent border-0 p-0 text-xs text-gray-600">Süti beállítások</button>
      </div>
    </div>
  </footer>

  <!-- COOKIE BANNER -->
  <div id="cookie-banner"
    style="display:flex;opacity:0;transition:opacity 0.3s;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1a1f2e;border-top:2px solid #F5B800;padding:1rem 1.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
    <p style="margin:0;font-size:0.85rem;color:#ccc;max-width:600px;">
      Ez az oldal Google Ads hirdetési sütiket használ.
      <a href="privacy.html" style="color:#F5B800;text-decoration:underline;">Adatvédelmi tájékoztató</a>
    </p>
    <div style="display:flex;gap:0.75rem;flex-shrink:0;">
      <button id="cookie-reject" style="background:transparent;border:1px solid rgba(255,255,255,0.3);color:#ccc;padding:0.5rem 1.25rem;border-radius:99px;cursor:pointer;font-size:0.85rem;">Elutasítom</button>
      <button id="cookie-accept" style="background:#F5B800;border:none;color:#1a1a2e;font-weight:800;padding:0.5rem 1.25rem;border-radius:99px;cursor:pointer;font-size:0.85rem;">Elfogadom</button>
    </div>
  </div>
  <script>
    (function(){
      const b = document.getElementById('cookie-banner');
      if (!localStorage.getItem('rapidtaxi_consent') && b) b.style.opacity = '1';
    })();
  </script>

</body>
</html>
